image: ahmedmorad101/openjdk23-maven
stages:
- test
- checkstyle
- codequality

junit_tests:
  stage: test
  script:
    - mvn test
  tags:
    - docker
  artifacts:
    expire_in: 2 days
    reports:
      junit:
        - target/surefire-reports/*.xml

checkstyle:
  stage: checkstyle
  script:
    - mvn clean install checkstyle:check || true
  tags:
    - docker
  artifacts:
    expire_in: 1 hr
    paths:
      - target/checkstyle-result.xml

convert_checkstyle_to_codequality:
  image: python:3.11-slim
  stage: codequality
  dependencies:
    - checkstyle
  script:
    - |
      python3 -c "
      import xml.etree.ElementTree as ET, json, os, sys
      severity_map = {
          'info': 'info',
          'warning': 'minor',
          'error': 'major'
      }
      tree = ET.parse('target/checkstyle-result.xml')
      issues = []
      for file in tree.findall('.//file'):
          filename = os.path.relpath(file.attrib['name'])
          for error in file.findall('error'):
              issues.append({
                  'description': error.attrib.get('message', ''),
                  'severity': severity_map.get(error.attrib.get('severity', 'warning'), 'minor'),
                  'fingerprint': filename + ':' + error.attrib.get('line', ''),
                  'location': {
                      'path': filename,
                      'lines': {'begin': int(error.attrib.get('line', 1))}
                  }
              })
      with open('gl-code-quality-report.json', 'w') as f:
          json.dump(issues, f, indent=4)
      if len(issues) > 0:
          sys.exit(1)
      "
  tags:
    - docker
  artifacts:
    expire_in: 2 days
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - gl-code-quality-report.json
  allow_failure: true
